trigger:
  - azure-3tier-app

pool:
  vmImage: 'ubuntu-latest'

variables:
  ACR_NAME: 'prodacr12345'
  IMAGE_NAME: 'backend'
  IMAGE_TAG: '$(Build.BuildId)'

stages:

- stage: Build
  displayName: Build and Push Docker Image

  jobs:
    - job: DockerBuildPush

      steps:
        - checkout: self

        - task: Docker@2
          displayName: Build and Push Backend Image
          inputs:
            command: buildAndPush
            repository: backend
            dockerfile: backend/Dockerfile
            containerRegistry: ACR-Service-Connection
            tags: |
              $(IMAGE_TAG)

- stage: Deploy
  displayName: Deploy to AKS

  dependsOn: Build

  jobs:
    - job: HelmDeploy

      steps:
        - checkout: self

        - task: Kubernetes@1
          displayName: AKS Login
          inputs:
            connectionType: Azure Resource Manager
            azureSubscriptionEndpoint: Azure-Service-Connection
            azureResourceGroup: rg-prod-app
            kubernetesCluster: prod-aks
            command: login

        - script: |
            helm upgrade --install three-tier-app ./helm/three-tier-app \
              --set backend.image=$(ACR_NAME).azurecr.io/backend:$(IMAGE_TAG)
          displayName: Helm Upgrade Deploy

        - script: |
            kubectl get pods
            kubectl get svc
            kubectl get ingress
          displayName: Verify Deployment
